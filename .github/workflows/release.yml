name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: aarch64-apple-darwin
          - os: ubuntu-latest
            platform: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make
      # Don't ship binaries that fail the repo's own suites.
      - name: Verify
        run: make test
      - name: Package
        run: |
          dir="C-Compiler-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
          mkdir "$dir"
          cp build/bin/C-Compiler "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      # A tarball nobody can verify is a tarball nobody should run.
      - name: Checksum
        run: |
          out="SHA256SUMS-${GITHUB_REF_NAME}-${{ matrix.platform }}.txt"
          if command -v sha256sum >/dev/null; then
            sha256sum *.tar.gz > "$out"
          else
            shasum -a 256 *.tar.gz > "$out"
          fi
          cat "$out"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            SHA256SUMS-*.txt
          generate_release_notes: true
